# Compose file for production

services:
  # Site
  web:
    container_name: web
    image: ghcr.io/kakajuro/tidytube-web:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_UMAMI_ENABLED=1
    env_file:
      - web/.env.local
    networks:
      - tidytube-prod
      - global-network

  # Server
  server:
    container_name: server
    image: ghcr.io/kakajuro/tidytube-server:latest
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - NODE_ENV=production
    env_file:
      - server/.env
    networks:
      - tidytube-prod
      - global-network
  
  # Database
  db:
    container_name: db
    image: redis:alpine
    restart: unless-stopped
    command: sh -c "redis-server /usr/local/etc/redis/redis.conf --requirepass $$REDIS_PASSWORD"
    volumes:
      - ./redis/redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    env_file:
      - server/.env
    networks:
      - tidytube-prod
      - global-network

  # Umami (website analytics)
  umami:
    container_name: umami
    image: ghcr.io/umami-software/umami:postgresql-latest
    ports:
      - "3000:3000"
    depends_on:
      umami_db:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:3000/api/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file: 
      - ./umami/.env
    networks:
      - tidytube-prod
      - global-network
  umami_db:
    container_name: umami_db
    image: postgres:15-alpine
    volumes:
      - ./umami/umami-db-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file: 
      - ./umami/.env
    networks:
      - tidytube-prod
      - global-network

  # Statping for uptime stats
  statping:
    container_name: statping
    image: adamboutcher/statping-ng
    restart: unless-stopped
    volumes:
      - ./statping:/app
    environment:
      DB_CONN: sqlite
    networks:
      - tidytube-prod
      - global-network

networks:
  tidytube-prod:
    name: tidytube-prod

  global-network:
    external: true